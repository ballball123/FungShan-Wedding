<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="屋企資訊站" />
  <link rel="manifest" href="manifest.json" />
  <title>屋企資訊站 // 沙田愉翠苑終端</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;700&display=swap');

    :root {
      --bg-color: #050505;
      --panel-bg: #0f0d0a;
      --amber: #ff7a00;
      --amber-bright: #ffa84d;
      --amber-dim: #5c2c00;
      --amber-glow: rgba(255, 122, 0, 0.35);
      --border-color: #3d1d00;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--amber);
      font-family: 'Share Tech Mono', 'Noto Sans TC', monospace;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 復古 CRT 掃描線 */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 999;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      background: #080604;
    }

    .sys-title {
      font-size: 14px;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px var(--amber-glow);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      border: 1px solid var(--amber);
      padding: 2px 8px;
      border-radius: 3px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background-color: var(--amber);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--amber);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      position: relative;
    }

    .page {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .retro-box {
      background: var(--panel-bg);
      border: 1.5px solid var(--amber-dim);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: inset 0 0 15px rgba(255, 122, 0, 0.05);
    }

    .box-label {
      font-size: 12px;
      color: var(--amber-bright);
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 4px;
    }

    /* 第一頁：天氣與時鐘 */
    .clock-display {
      font-size: 52px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 3px;
      text-shadow: 0 0 14px var(--amber-glow);
      margin: 4px 0;
    }

    .date-display {
      text-align: center;
      font-size: 14px;
      color: var(--amber-bright);
    }

    .weather-main {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
    }

    .temp-big {
      font-size: 60px;
      font-weight: bold;
      text-shadow: 0 0 15px var(--amber-glow);
    }

    .weather-stats {
      font-size: 15px;
      line-height: 1.8;
    }

    .forecast-text {
      font-size: 14px;
      line-height: 1.6;
      color: #e68a2e;
    }

    /* 第二頁：沙田愉翠苑巴士報站器 */
    .bus-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .btn-retro {
      background: transparent;
      color: var(--amber);
      border: 1.5px solid var(--amber);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-retro:active {
      background: var(--amber);
      color: #000;
    }

    .bus-filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .bus-search {
      flex: 1;
      background: #000;
      border: 1px solid var(--amber-dim);
      color: var(--amber);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 14px;
      border-radius: 4px;
      outline: none;
    }

    .bus-search:focus {
      border-color: var(--amber);
    }

    .bus-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 12px;
      border: 1px solid var(--border-color);
      background: #0c0a08;
      margin-bottom: 8px;
      border-radius: 5px;
      position: relative;
    }

    .bus-row.pinned {
      border-color: var(--amber);
      background: #140f09;
    }

    .star-btn {
      background: none;
      border: none;
      color: var(--amber-dim);
      font-size: 18px;
      padding: 0 8px 0 0;
      cursor: pointer;
    }

    .star-btn.active {
      color: var(--amber-bright);
      text-shadow: 0 0 8px var(--amber);
    }

    .bus-route {
      font-size: 26px;
      font-weight: bold;
      min-width: 68px;
      text-shadow: 0 0 8px var(--amber-glow);
    }

    .bus-dest {
      flex: 1;
      padding: 0 8px;
    }

    .bus-dest-main {
      font-size: 15px;
      font-weight: bold;
    }

    .bus-stop-sub {
      font-size: 11px;
      color: #b35900;
      margin-top: 3px;
    }

    .bus-etas {
      text-align: right;
      min-width: 85px;
    }

    .eta-first {
      font-size: 20px;
      font-weight: bold;
      color: var(--amber-bright);
      text-shadow: 0 0 8px var(--amber-glow);
    }

    .eta-arriving {
      animation: blink 1s infinite;
      color: #ffcc00;
    }

    .eta-next {
      font-size: 12px;
      color: #994d00;
      margin-top: 2px;
    }

    /* 第三頁：家庭行事曆 */
    .cal-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cal-row-inputs {
      display: flex;
      gap: 8px;
    }

    input[type="date"], input[type="text"], select {
      background: #000;
      border: 1px solid var(--amber-dim);
      color: var(--amber);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 14px;
      border-radius: 4px;
      outline: none;
    }

    input[type="date"] { flex: 1; }
    input[type="text"] { width: 100%; }

    .event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-left: 3px solid var(--amber);
      background: #120e0a;
      margin-bottom: 8px;
    }

    .event-date {
      font-size: 12px;
      color: var(--amber-bright);
    }

    .event-title {
      font-size: 15px;
      margin-top: 3px;
    }

    .tag {
      display: inline-block;
      font-size: 11px;
      border: 1px solid var(--amber);
      padding: 1px 5px;
      margin-right: 6px;
      border-radius: 2px;
    }

    .del-btn {
      background: none;
      border: none;
      color: #803d00;
      font-size: 16px;
      padding: 4px 8px;
      cursor: pointer;
    }

    /* 底部導航列 */
    nav {
      display: flex;
      border-top: 2px solid var(--border-color);
      background: #080604;
    }

    .nav-item {
      flex: 1;
      text-align: center;
      padding: 11px 0;
      font-size: 13px;
      color: #803d00;
      cursor: pointer;
      border-right: 1px solid #1f0f00;
    }

    .nav-item:last-child { border-right: none; }

    .nav-item.active {
      color: #000;
      background: var(--amber);
      font-weight: bold;
      box-shadow: 0 0 15px var(--amber-glow);
    }

    .nav-icon {
      display: block;
      font-size: 15px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <header>
    <div class="sys-title">SHATIN YUE CHUI // TERMINAL</div>
    <div class="live-badge"><span class="dot"></span> ONLINE</div>
  </header>

  <main>
    <!-- 第一頁：天氣與時鐘 -->
    <section id="page-weather" class="page active">
      <div class="retro-box">
        <div class="box-label"><span>SYSTEM CLOCK</span><span>HKT UTC+8</span></div>
        <div class="clock-display" id="clock">00:00:00</div>
        <div class="date-display" id="date">LOADING...</div>
      </div>

      <div class="retro-box">
        <div class="box-label"><span>HKO WEATHER // 沙田區</span><span id="weather-update">--:--</span></div>
        <div class="weather-main">
          <div class="temp-big" id="temp">--°</div>
          <div class="weather-stats">
            <div>相對濕度：<span id="humidity">--</span>%</div>
            <div>天氣狀況：<span id="weather-desc">讀取中</span></div>
            <div>紫外線：<span id="uv-index">--</span></div>
          </div>
        </div>
      </div>

      <div class="retro-box">
        <div class="box-label"><span>LOCAL FORECAST // 本港天氣預報</span></div>
        <div class="forecast-text" id="forecast-text">正在連線香港天文台伺服器...</div>
      </div>
    </section>

    <!-- 第二頁：沙田愉翠苑附近巴士報站器 -->
    <section id="page-bus" class="page">
      <div class="bus-top-bar">
        <div>
          <div style="font-size: 16px; font-weight: bold;">沙田愉翠苑 // 巴士報站器</div>
          <div style="font-size: 11px; color: #b35900;" id="bus-update-time">準備連線九巴數據庫...</div>
        </div>
        <button class="btn-retro" onclick="fetchBusETA(true)">↻ 立即刷新</button>
      </div>

      <div class="bus-filter-bar">
        <input type="text" id="bus-search" class="bus-search" placeholder="搜尋路線 (如 80K, 89X, 49X)..." oninput="renderBusList()" />
        <button class="btn-retro" id="btn-only-pinned" onclick="togglePinnedFilter()">★ 只看收藏</button>
      </div>

      <div id="bus-list">
        <div class="retro-box" style="text-align:center; padding: 30px;">正在搜尋愉翠苑周邊所有巴士站...</div>
      </div>
    </section>

    <!-- 第三頁：家庭共用行事曆 -->
    <section id="page-calendar" class="page">
      <div class="retro-box">
        <div class="box-label"><span>NEW SCHEDULE // 新增家庭日程</span></div>
        <div class="cal-form">
          <div class="cal-row-inputs">
            <input type="date" id="event-date" />
            <select id="event-tag">
              <option value="家庭">家庭</option>
              <option value="學校">學校</option>
              <option value="覆診">覆診</option>
              <option value="繳費">繳費</option>
            </select>
          </div>
          <div class="cal-row-inputs">
            <input type="text" id="event-title" placeholder="輸入事項（例如：交功課 / 飲茶）" />
            <button class="btn-retro" onclick="addEvent()">+ 加入</button>
          </div>
        </div>
      </div>

      <div class="retro-box">
        <div class="box-label"><span>SHARED LOG // 近期家庭日程</span><span id="event-count">0 項</span></div>
        <div id="event-list"></div>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-item active" onclick="switchTab('weather', this)">
      <span class="nav-icon">[ 01 ]</span>天氣時鐘
    </div>
    <div class="nav-item" onclick="switchTab('bus', this)">
      <span class="nav-icon">[ 02 ]</span>愉翠巴士
    </div>
    <div class="nav-item" onclick="switchTab('calendar', this)">
      <span class="nav-icon">[ 03 ]</span>家庭日程
    </div>
  </nav>

  <script>
    let busAutoRefreshTimer = null;

    // 1. 分頁切換
    function switchTab(tabName, el) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('page-' + tabName).classList.add('active');
      el.classList.add('active');

      if (tabName === 'bus') {
        fetchBusETA();
        if (!busAutoRefreshTimer) {
          busAutoRefreshTimer = setInterval(() => {
            if (document.getElementById('page-bus').classList.contains('active')) {
              fetchBusETA();
            }
          }, 30000); // 每 30 秒自動更新班次
        }
      }
    }

    // 2. 數碼時鐘
    function updateClock() {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
      const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} [ ${days[now.getDay()]} ]`;
      document.getElementById('clock').innerText = timeStr;
      document.getElementById('date').innerText = dateStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 3. 香港天文台 API (天氣)
    async function fetchWeather() {
      try {
        const resCurrent = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
        const dataCurrent = await resCurrent.json();

        const shatinTemp = dataCurrent.temperature.data.find(d => d.place === '沙田') || dataCurrent.temperature.data[0];
        document.getElementById('temp').innerText = `${shatinTemp.value}°`;
        document.getElementById('humidity').innerText = dataCurrent.humidity.data[0].value;
        document.getElementById('uv-index').innerText = dataCurrent.uvindex ? dataCurrent.uvindex.data[0].desc : '無資料';

        const updateTime = new Date(dataCurrent.updateTime);
        document.getElementById('weather-update').innerText = `${String(updateTime.getHours()).padStart(2,'0')}:${String(updateTime.getMinutes()).padStart(2,'0')} 更新`;

        const resForecast = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc');
        const dataForecast = await resForecast.json();
        document.getElementById('weather-desc').innerText = dataForecast.generalSituation ? '正常' : '多雲';
        document.getElementById('forecast-text').innerText = `${dataForecast.forecastDesc}\n\n${dataForecast.outlook}`;
      } catch (err) {
        document.getElementById('forecast-text').innerText = '天氣數據連線失敗，請檢查網絡。';
      }
    }
    fetchWeather();

    // 4. 沙田愉翠苑附近九巴實時報站器 (自動檢索愉翠苑周邊站點)
    let yueChuiStopsCache = null;
    let latestBusGroups = [];
    let onlyShowPinned = false;
    let pinnedRoutes = JSON.parse(localStorage.getItem('yuechui_pinned_routes') || '["80K", "82K", "89X", "49X"]');

    function togglePin(routeKey) {
      if (pinnedRoutes.includes(routeKey)) {
        pinnedRoutes = pinnedRoutes.filter(r => r !== routeKey);
      } else {
        pinnedRoutes.push(routeKey);
      }
      localStorage.setItem('yuechui_pinned_routes', JSON.stringify(pinnedRoutes));
      renderBusList();
    }

    function togglePinnedFilter() {
      onlyShowPinned = !onlyShowPinned;
      const btn = document.getElementById('btn-only-pinned');
      btn.style.background = onlyShowPinned ? 'var(--amber)' : 'transparent';
      btn.style.color = onlyShowPinned ? '#000' : 'var(--amber)';
      renderBusList();
    }

    async function getYueChuiStops() {
      if (yueChuiStopsCache) return yueChuiStopsCache;
      // 從九巴官方站點庫動態匹配所有「愉翠苑」及「牛皮沙街/插桅杆街」站點
      const res = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
      const json = await res.json();
      yueChuiStopsCache = json.data.filter(s =>
        s.name_tc.includes('愉翠苑') ||
        s.name_tc.includes('牛皮沙街') ||
        s.name_tc.includes('第一城站')
      );
      return yueChuiStopsCache;
    }

    async function fetchBusETA(manual = false) {
      const statusEl = document.getElementById('bus-update-time');
      if (manual) statusEl.innerText = '正在同步最新班次...';

      try {
        const stops = await getYueChuiStops();
        const promises = stops.map(stop =>
          fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stop.stop}`)
            .then(r => r.json())
            .then(j => (j.data || []).map(item => ({ ...item, stopName: stop.name_tc })))
        );

        const results = await Promise.all(promises);
        const allRoutes = results.flat();

        const grouped = {};
        const now = new Date();

        allRoutes.forEach(item => {
          if (!item.eta) return;
          // 過濾掉已經駛離超過 1 分鐘的舊班次
          const etaDate = new Date(item.eta);
          const diffSeconds = (etaDate - now) / 1000;
          if (diffSeconds < -60) return;

          const key = `${item.route}_${item.dir}_${item.stop}`;
          if (!grouped[key]) {
            grouped[key] = {
              route: item.route,
              dest: item.dest_tc,
              stopName: item.stopName,
              etas: [],
              remarks: []
            };
          }
          const diffMins = Math.max(0, Math.round(diffSeconds / 60));
          grouped[key].etas.push(diffMins);
          if (item.rmk_tc && !grouped[key].remarks.includes(item.rmk_tc)) {
            grouped[key].remarks.push(item.rmk_tc);
          }
        });

        latestBusGroups = Object.values(grouped).map(bus => {
          bus.etas.sort((a, b) => a - b);
          return bus;
        });

        renderBusList();

        const t = new Date();
        statusEl.innerText = `愉翠苑周邊 ${stops.length} 個站點 • ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')} 更新`;
      } catch (e) {
        document.getElementById('bus-list').innerHTML = '<div class="retro-box">九巴伺服器連線逾時，請按右上角刷新。</div>';
      }
    }

    function renderBusList() {
      const listEl = document.getElementById('bus-list');
      const keyword = document.getElementById('bus-search').value.trim().toUpperCase();

      let filtered = latestBusGroups.filter(bus => {
        const matchKeyword = !keyword || bus.route.includes(keyword) || bus.dest.includes(keyword);
        const matchPin = !onlyShowPinned || pinnedRoutes.includes(bus.route);
        return matchKeyword && matchPin;
      });

      // 收藏路線置頂，其餘按路線號碼排序
      filtered.sort((a, b) => {
        const aPin = pinnedRoutes.includes(a.route) ? 0 : 1;
        const bPin = pinnedRoutes.includes(b.route) ? 0 : 1;
        if (aPin !== bPin) return aPin - bPin;
        return a.route.localeCompare(b.route, undefined, { numeric: true });
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="retro-box" style="text-align:center; padding: 24px;">找不到符合條件的巴士班次</div>';
        return;
      }

      listEl.innerHTML = filtered.map(bus => {
        const isPinned = pinnedRoutes.includes(bus.route);
        const firstMin = bus.etas[0];
        const firstText = firstMin === 0 ? '即將到達' : `${firstMin} 分鐘`;
        const arrivingClass = firstMin <= 1 ? 'eta-arriving' : '';
        const nextText = bus.etas.slice(1, 3).map(m => `${m}分`).join(' / ') || '暫無下班';
        const rmkText = bus.remarks.length > 0 ? ` [${bus.remarks[0]}]` : '';

        return `
          <div class="bus-row ${isPinned ? 'pinned' : ''}">
            <button class="star-btn ${isPinned ? 'active' : ''}" onclick="togglePin('${bus.route}')">★</button>
            <div class="bus-route">${bus.route}</div>
            <div class="bus-dest">
              <div class="bus-dest-main">往 ${bus.dest}</div>
              <div class="bus-stop-sub">@ ${bus.stopName}${rmkText}</div>
            </div>
            <div class="bus-etas">
              <div class="eta-first ${arrivingClass}">${firstText}</div>
              <div class="eta-next">下班: ${nextText}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 5. 家庭行事曆
    const DEFAULT_EVENTS = [
      { id: 1, date: new Date().toISOString().split('T')[0], tag: '家庭', title: '測試家庭行事曆功能' }
    ];

    function loadEvents() {
      const saved = localStorage.getItem('family_retro_events');
      const events = saved ? JSON.parse(saved) : DEFAULT_EVENTS;
      events.sort((a, b) => new Date(a.date) - new Date(b.date));

      document.getElementById('event-count').innerText = `${events.length} 項`;
      const listEl = document.getElementById('event-list');

      if (events.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding: 20px; color:#803d00;">暫無日程記錄</div>';
        return;
      }

      listEl.innerHTML = events.map(ev => `
        <div class="event-item">
          <div>
            <div class="event-date">${ev.date}</div>
            <div class="event-title"><span class="tag">${ev.tag}</span>${ev.title}</div>
          </div>
          <button class="del-btn" onclick="deleteEvent(${ev.id})">✕</button>
        </div>
      `).join('');
    }

    function addEvent() {
      const dateInput = document.getElementById('event-date');
      const tagInput = document.getElementById('event-tag');
      const titleInput = document.getElementById('event-title');

      if (!dateInput.value || !titleInput.value.trim()) {
        alert('請選擇日期並輸入事項內容');
        return;
      }

      const saved = localStorage.getItem('family_retro_events');
      const events = saved ? JSON.parse(saved) : DEFAULT_EVENTS;

      events.push({
        id: Date.now(),
        date: dateInput.value,
        tag: tagInput.value,
        title: titleInput.value.trim()
      });

      localStorage.setItem('family_retro_events', JSON.stringify(events));
      titleInput.value = '';
      loadEvents();
    }

    function deleteEvent(id) {
      const saved = localStorage.getItem('family_retro_events');
      if (!saved) return;
      const events = JSON.parse(saved).filter(ev => ev.id !== id);
      localStorage.setItem('family_retro_events', JSON.stringify(events));
      loadEvents();
    }

    document.getElementById('event-date').valueAsDate = new Date();
    loadEvents();
  </script>
</body>
</html>
